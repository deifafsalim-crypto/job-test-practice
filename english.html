const RULES = [
{en:'Present Simple vs Present Continuous', ar:'المضارع البسيط والمضارع المستمر', body:`
<h3>Present Simple</h3>
<p>نستخدمه للعادات المتكررة والحقائق الثابتة. مع he / she / it نضيف <b>s</b> أو <b>es</b> للفعل.</p>
<p>كلمات دالة: always, usually, often, every day, never</p>
<div class="ex">She <b>works</b> in a bank. / Water <b>boils</b> at 100°C.</div>
<h3>Present Continuous</h3>
<p>لحدث يحصل الآن أو وضع مؤقت. التركيب: <b>am / is / are + V-ing</b></p>
<p>كلمات دالة: now, right now, at the moment, today, Look!, Listen!</p>
<div class="ex">I <b>am studying</b> now. / He usually drives, but today he <b>is walking</b>.</div>
<div class="tip">أفعال الحالة مثل know, like, want, believe, need لا تأتي عادة بـ ing: نقول I know وليس I am knowing.</div>`},

{en:'Past Simple vs Present Perfect', ar:'الماضي البسيط والمضارع التام', body:`
<h3>Past Simple</h3>
<p>لحدث انتهى في وقت محدد في الماضي.</p>
<p>كلمات دالة: yesterday, last week, in 2020, ago, when I was a child</p>
<div class="ex">I <b>saw</b> him yesterday.</div>
<h3>Present Perfect</h3>
<p>التركيب: <b>have / has + V3</b>. لحدث وقته غير محدد، أو بدأ في الماضي وما زال مستمراً، أو له أثر الآن.</p>
<p>كلمات دالة: ever, never, already, yet, just, since, for</p>
<div class="ex">She <b>has lived</b> in Muscat since 2020. / <b>Have</b> you ever <b>been</b> to London?</div>
<h3>Present Perfect Continuous</h3>
<p>التركيب: <b>have / has been + V-ing</b>. لحدث بدأ في الماضي وما زال مستمراً، ونركز فيه على المدة.</p>
<p>كلمات دالة: for, since, all day, how long</p>
<div class="ex">I <b>have been studying</b> for 2 hours.<br>How long <b>have</b> you <b>been waiting</b>?</div>
<h3>Past Continuous</h3>
<p>التركيب: <b>was / were + V-ing</b>. لحدث كان مستمراً في وقت معين في الماضي، أو قطعه حدث ثاني.</p>
<p>كلمات دالة: while, when, at that time, at 8 pm yesterday</p>
<div class="ex">I <b>was watching</b> TV at 8 pm.<br>She <b>was cooking</b> when the phone rang.</div>
<div class="tip"><b>since</b> + نقطة بداية (since 2020) و <b>for</b> + مدة (for three years). ولا نقول I have seen him yesterday، لأن yesterday وقت محدد يحتاج Past Simple.</div>`},

{en:'Past Perfect', ar:'الماضي التام', body:`
<p>التركيب: <b>had + V3</b>. نستخدمه للحدث الأسبق عندما يكون عندنا حدثان في الماضي.</p>
<p>كلمات دالة: by the time, before, after, already, when</p>
<div class="ex">By the time we arrived, the film <b>had started</b>.<br>(بداية الفيلم حصلت أولاً، ثم وصولنا)</div>
<div class="tip">الحدث الأقدم = had + V3، والحدث الأحدث = Past Simple.</div>`},

{en:'Future Forms', ar:'صيغ المستقبل', body:`
<h3>will</h3><p>لقرار لحظي، أو وعد، أو توقع مبني على رأي.</p>
<div class="ex">The phone is ringing. I <b>will answer</b> it.</div>
<h3>be going to</h3><p>لخطة مقررة مسبقاً، أو توقع مبني على دليل نراه الآن.</p>
<div class="ex">Look at those clouds! It <b>is going to</b> rain.</div>
<h3>Present Continuous للمستقبل</h3><p>لموعد مرتب ومؤكد.</p>
<div class="ex">I <b>am seeing</b> my dentist at 4 pm tomorrow.</div>
<h3>Present Simple للجداول</h3><p>للمواعيد الرسمية الثابتة مثل الرحلات والقطارات.</p>
<div class="ex">The plane <b>leaves</b> at 9 pm tomorrow.</div>
<h3>Future Continuous: will be + V-ing</h3><p>لحدث مستمر في وقت محدد في المستقبل.</p>
<div class="ex">This time tomorrow, I <b>will be lying</b> on the beach.</div>
<h3>Future Perfect: will have + V3</h3><p>لحدث سينتهي قبل وقت محدد في المستقبل (غالباً مع by).</p>
<div class="ex">By next June, I <b>will have finished</b> my degree.</div>
<div class="tip">بعد when / as soon as / before / if نستخدم Present Simple حتى لو المعنى مستقبل: When I <b>get</b> home, I will call you.</div>`},

{en:'Conditionals', ar:'الجمل الشرطية', body:`
<h3>Zero Conditional: الحقائق</h3>
<div class="ex">If + present, present<br>If you heat ice, it <b>melts</b>.</div>
<h3>First Conditional: احتمال حقيقي في المستقبل</h3>
<div class="ex">If + present, will + V<br>If it rains, I <b>will stay</b> home.</div>
<h3>Second Conditional: افتراض غير واقعي في الحاضر</h3>
<div class="ex">If + past, would + V<br>If I <b>had</b> more money, I would buy a car.</div>
<h3>Third Conditional: ماضٍ لم يحدث</h3>
<div class="ex">If + had + V3, would have + V3<br>If I <b>had studied</b> harder, I would have passed.</div>
<div class="tip">لا نستخدم will بعد if مباشرة: نقول If it rains وليس If it will rain.</div>`},

{en:'Passive Voice', ar:'المبني للمجهول', body:`
<p>نستخدمه عندما يكون المهم هو الحدث أو الشيء، وليس الفاعل. التركيب: <b>be (بزمن الجملة) + V3</b></p>
<ul>
<li>المضارع: is / are + V3</li>
<li>الماضي: was / were + V3</li>
<li>المستقبل: will be + V3</li>
<li>المضارع التام: has / have been + V3</li>
</ul>
<div class="ex">English <b>is spoken</b> in many countries.<br>The report <b>was written</b> by the manager.<br>The bridge <b>will be built</b> next year.</div>
<div class="tip">نذكر الفاعل بعد <b>by</b> فقط إذا كان مهماً.</div>`},

{en:'Subject-Verb Agreement', ar:'توافق الفاعل مع الفعل', body:`
<ul>
<li><b>each / every / everyone / nobody</b> + فعل مفرد</li>
<li><b>neither ... nor / either ... or</b>: الفعل يتبع الاسم الأقرب له</li>
<li><b>the number of</b> + فعل مفرد، و <b>a number of</b> + فعل جمع</li>
<li>الأسماء غير المعدودة (information, news, advice, furniture) تأخذ فعلاً مفرداً</li>
<li><b>one of</b> + جمع + فعل مفرد: One of my friends <b>is</b> a doctor.</li>
<li><b>both ... and</b> + فعل جمع، و <b>the police</b> دائماً جمع</li>
<li>أسماء المواد مثل mathematics, physics تأخذ فعلاً مفرداً</li>
</ul>
<div class="ex">Each of the students <b>has</b> a laptop.<br>Neither the manager nor the employees <b>were</b> ready.<br>The number of applicants <b>has</b> increased.</div>`},

{en:'Articles: a / an / the', ar:'أدوات التعريف والتنكير', body:`
<ul>
<li><b>a</b> قبل صوت ساكن: a book, a university (تُنطق يو)</li>
<li><b>an</b> قبل صوت متحرك: an apple, an hour, an honest man (الـ h صامتة)</li>
<li><b>the</b> للشيء المحدد أو الفريد: the sun, the book I bought</li>
<li><b>بدون أداة</b> للأشياء العامة والجمع والمفاهيم: I like music. Life is short.</li>
</ul>
<div class="tip">العبرة بالصوت وليس بالحرف المكتوب.</div>`},

{en:'Prepositions of Time and Place', ar:'حروف الجر للزمن والمكان', body:`
<h3>الزمن</h3>
<ul>
<li><b>in</b>: الشهور والسنوات والفصول وأجزاء اليوم (in May, in 1999, in the morning)</li>
<li><b>on</b>: الأيام والتواريخ (on Monday, on 5 May)</li>
<li><b>at</b>: الوقت المحدد (at 7 o'clock, at night, at noon)</li>
</ul>
<h3>المكان</h3>
<ul>
<li><b>in</b>: داخل مكان (in the room, in Oman)</li>
<li><b>on</b>: على سطح (on the table, on the wall)</li>
<li><b>at</b>: نقطة أو موقع محدد (at the station, at the door)</li>
</ul>`},

{en:'Comparatives and Superlatives', ar:'المقارنة والتفضيل', body:`
<ul>
<li>الصفات القصيرة: <b>-er / -est</b> (big → bigger → the biggest)</li>
<li>الصفات المنتهية بـ y: easy → easier → the easiest</li>
<li>الصفات الطويلة: <b>more / most</b> (more intelligent, the most intelligent)</li>
<li>الشاذة: good → better → best، bad → worse → worst، far → further → furthest</li>
</ul>
<div class="ex">This exam was <b>easier than</b> the last one.<br>The more you practise, <b>the better</b> you become.</div>
<div class="tip">لا نجمع الطريقتين: لا نقول more easier.</div>`},

{en:'Relative Clauses', ar:'الضمائر الموصولة', body:`
<ul>
<li><b>who</b>: للأشخاص</li>
<li><b>which</b>: للأشياء والحيوانات</li>
<li><b>that</b>: للأشخاص والأشياء (في الجمل المحددة)</li>
<li><b>whose</b>: للملكية</li>
<li><b>where</b>: للمكان، و <b>when</b>: للزمن</li>
</ul>
<div class="ex">The woman <b>who</b> lives next door is a doctor.<br>The man <b>whose</b> car was stolen called the police.<br>This is the house <b>where</b> I grew up.</div>`},

{en:'Gerunds and Infinitives', ar:'المصدر بـ ing والمصدر بـ to', body:`
<h3>V-ing بعد:</h3>
<p>enjoy, avoid, finish, mind, suggest, keep, look forward to، وبعد أي حرف جر</p>
<div class="ex">I enjoy <b>reading</b>. / I look forward to <b>seeing</b> you.</div>
<h3>to + V بعد:</h3>
<p>decide, want, hope, plan, agree, need, refuse, promise</p>
<div class="ex">She decided <b>to accept</b> the job.</div>
<div class="tip">في look forward to تكون to حرف جر، لذلك يأتي بعدها V-ing.</div>`},

{en:'Modal Verbs', ar:'الأفعال الناقصة', body:`
<ul>
<li><b>must</b>: إلزام أو استنتاج قوي</li>
<li><b>mustn't</b>: ممنوع</li>
<li><b>don't have to</b>: غير ضروري (اختياري)</li>
<li><b>should</b>: نصيحة</li>
<li><b>might / may</b>: احتمال</li>
<li><b>can't</b>: استنتاج بأن الشيء مستحيل</li>
</ul>
<div class="ex">You <b>mustn't</b> smoke here.<br>You <b>don't have to</b> come if you are busy.<br>He <b>can't</b> be at home; I just saw him at the mall.</div>
<div class="tip">بعد الفعل الناقص يأتي فعل مجرد بدون to وبدون s: she can swim.</div>`},

{en:'Reported Speech', ar:'الكلام المنقول', body:`
<p>عند نقل كلام شخص بعد said / told، نرجع الزمن خطوة للخلف:</p>
<ul>
<li>am / is → was</li>
<li>present simple → past simple</li>
<li>will → would، can → could</li>
<li>past simple → past perfect</li>
</ul>
<div class="ex">She said, “I am tired.” → She said that she <b>was</b> tired.<br>“I will call you.” → He said he <b>would</b> call me.</div>
<div class="tip">السؤال المنقول يأخذ ترتيب الجملة العادية: He asked where I <b>lived</b> (وليس where did I live).</div>`},

{en:'Countable / Uncountable and Quantifiers', ar:'المعدود وغير المعدود وكلمات الكمية', body:`
<ul>
<li>مع المعدود: <b>many, few, a few, fewer</b></li>
<li>مع غير المعدود: <b>much, little, a little, less</b></li>
<li><b>some</b> في الإثبات والطلب، و <b>any</b> في النفي والسؤال</li>
</ul>
<p>أسماء غير معدودة شائعة: information, advice, money, furniture, news, equipment</p>
<div class="ex">How <b>much</b> money? / How <b>many</b> people?<br>There are <b>fewer</b> people today.</div>`},

{en:'Linking Words', ar:'أدوات الربط', body:`
<ul>
<li><b>although / even though</b> + جملة كاملة</li>
<li><b>despite / in spite of</b> + اسم أو V-ing</li>
<li><b>however</b>: تناقض بين جملتين، وتأتي بعدها فاصلة</li>
<li><b>therefore</b>: نتيجة</li>
<li><b>unless</b> = if not</li>
<li><b>because</b> + جملة، و <b>because of</b> + اسم</li>
</ul>
<div class="ex"><b>Although</b> it was raining, they played.<br><b>Despite</b> the rain, they played.<br>He was ill. <b>However</b>, he went to work.</div>`},

{en:'Vocabulary and Confusing Words', ar:'المفردات والكلمات المتشابهة', body:`
<ul>
<li><b>affect</b> فعل (يؤثر)، و <b>effect</b> اسم (تأثير)</li>
<li><b>lend</b> تعطي شيئاً مؤقتاً، و <b>borrow</b> تأخذ شيئاً مؤقتاً</li>
<li><b>raise</b> ترفع شيئاً (يحتاج مفعولاً)، و <b>rise</b> يرتفع بنفسه</li>
<li><b>do</b>: do a favour, do homework، و <b>make</b>: make a decision, make a mistake</li>
<li>أفعال مركبة: call off = يلغي، look after = يعتني، give up = يستسلم</li>
</ul>
<div class="tip">في أسئلة المرادفات: ضعي الخيار مكان الكلمة في الجملة، وشوفي إذا المعنى ما تغير.</div>`},

{en:'Reading Comprehension', ar:'فهم المقروء', body:`
<ol>
<li>اقرئي السؤال أولاً، ثم ابحثي في النص عن الكلمات المفتاحية.</li>
<li>انتبهي لكلمة <b>NOT</b> في السؤال.</li>
<li>الجواب الصحيح غالباً يكون بكلمات مختلفة عن النص (إعادة صياغة).</li>
<li>كلمات مثل however و on the other hand تدل على تناقض.</li>
<li>لا تجيبي من معلوماتك العامة، الجواب لازم يكون من النص.</li>
</ol>`},
{en:'Summary of the 10 Tenses', ar:'ملخص الأزمنة العشرة', body:`
<p>جدول يجمع كل الأزمنة في مكان واحد: الصيغة، ومتى نستخدمها، ومثال، والكلمات اللي تدل عليها. الكلمات الدالة هي أسرع طريقة تعرفين فيها الزمن المطلوب في السؤال.</p>
<div class="tbl"><table>
<thead><tr><th>الزمن</th><th>الصيغة</th><th>الاستخدام</th><th>مثال</th><th>كلمات دالة</th></tr></thead>
<tbody><tr><td><b>المضارع البسيط</b><div class="en muted">Present Simple</div></td><td class="en">I / You / We / They + V<br>He / She / It + V(s / es)</td><td>عادة متكررة أو حقيقة ثابتة</td><td class="en">I eat breakfast every day.</td><td class="en">always, usually, often, every day, once a week</td></tr><tr><td><b>المضارع المستمر</b><div class="en muted">Present Continuous</div></td><td class="en">am / is / are + V-ing</td><td>حدث يحصل الآن، أو وضع مؤقت</td><td class="en">She is studying now.</td><td class="en">now, at the moment, right now, currently</td></tr><tr><td><b>المضارع التام</b><div class="en muted">Present Perfect</div></td><td class="en">have / has + V3</td><td>حدث في الماضي له علاقة أو نتيجة في الحاضر</td><td class="en">I have finished my work.</td><td class="en">already, yet, just, ever, never, since, for</td></tr><tr><td><b>المضارع التام المستمر</b><div class="en muted">Present Perfect Continuous</div></td><td class="en">have / has been + V-ing</td><td>حدث بدأ في الماضي وما زال مستمراً لين الحين</td><td class="en">I have been studying for 2 hours.</td><td class="en">for, since, all day, how long</td></tr><tr><td><b>الماضي البسيط</b><div class="en muted">Past Simple</div></td><td class="en">V-ed (منتظم)<br>أو الفعل الشاذ</td><td>حدث بدأ وانتهى في وقت محدد في الماضي</td><td class="en">I visited my friend yesterday.</td><td class="en">yesterday, last night, last week, ago, in 2010</td></tr><tr><td><b>الماضي المستمر</b><div class="en muted">Past Continuous</div></td><td class="en">was / were + V-ing</td><td>حدث كان مستمراً في وقت معين في الماضي</td><td class="en">I was watching TV at 8 pm.</td><td class="en">while, when, at that time, at 8 pm yesterday</td></tr><tr><td><b>الماضي التام</b><div class="en muted">Past Perfect</div></td><td class="en">had + V3</td><td>حدث انتهى قبل حدث ثاني في الماضي</td><td class="en">I had eaten before he came.</td><td class="en">before, after, by the time</td></tr><tr><td><b>المستقبل البسيط</b><div class="en muted">Future Simple</div></td><td class="en">will + V</td><td>حدث بيصير في المستقبل</td><td class="en">I will travel tomorrow.</td><td class="en">tomorrow, next week, next year, in the future</td></tr><tr><td><b>المستقبل المستمر</b><div class="en muted">Future Continuous</div></td><td class="en">will be + V-ing</td><td>حدث بيكون مستمر في وقت معين في المستقبل</td><td class="en">I will be studying at 10 pm.</td><td class="en">at this time tomorrow, at 10 pm, this time next week</td></tr><tr><td><b>المستقبل التام</b><div class="en muted">Future Perfect</div></td><td class="en">will have + V3</td><td>حدث بينتهي قبل وقت معين في المستقبل</td><td class="en">I will have finished by 5 pm.</td><td class="en">by, before, by the time</td></tr></tbody></table></div>

<h3>طريقة سريعة في الاختبار</h3>
<ol>

const QS = RAW.trim().split('\n').map(l => {
  const f = l.split('|');
  const o = shuffle([f[2],f[3],f[4],f[5]]);
  return {r:+f[0], q:f[1], o, a:o.indexOf(f[2]), e:f[6], p:f[7] || undefined};
});

// ================= المنطق =================
let view = 'home', list = [], idx = 0, ans = {}, timed = false, left = 0, tid = null, cur = 0;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function go(v){ clearInterval(tid); view = v; render(); }
function openRule(r){ clearInterval(tid); cur = r; view = 'rule'; render(); }

function startList(arr, isTimed){
  list = arr; idx = 0; ans = {}; timed = isTimed; view = 'quiz';
  clearInterval(tid);
  if (isTimed) { left = 30*60; tid = setInterval(tick, 1000); }
  render();
}
function startAll(){ startList(QS.map((_,i)=>i), false); }
function startExam(){ startList(shuffle(QS.map((_,i)=>i)).slice(0,35), true); }
function startRule(r){ startList(QS.map((q,i)=>q.r===r?i:-1).filter(i=>i>=0), false); }

function tick(){
  left--;
  if (left <= 0) { left = 0; finish(); return; }
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(left);
}
function fmt(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function finish(){ clearInterval(tid); view = 'results'; render(); }

function pick(i){
  if (!timed && ans[idx] !== undefined) return;
  ans[idx] = i; render();
}
function next(){ if (idx < list.length-1) { idx++; render(); } else finish(); }
function prev(){ if (idx > 0) { idx--; render(); } }
function jump(i){ idx = i; render(); }

function render(){
  const app = document.getElementById('app');
  let h = '';

  if (view === 'home') {
    h = `<h1>تدريب اختبار الإنجليزي</h1>
      <p class="muted">${RULES.length-1} درس قواعد وملخص للأزمنة مع الشرح، و30 سؤال لكل قاعدة (المجموع ${QS.length} سؤال)، وكلها من تأليف المنصة.</p>
      <button class="big" onclick="go('lessons')">📘 الدروس: شرح كل قاعدة</button>
      <button class="big" onclick="startAll()">✏️ تدريب على كل الأسئلة مع التصحيح الفوري</button>
      <button class="big" onclick="startExam()">⏱️ اختبار محاكاة: 35 سؤال عشوائي في 30 دقيقة</button>`;
  }

  else if (view === 'lessons') {
    h = `<h1>الدروس</h1><button class="big" onclick="openRule(${RULES.length-1})">📋 ملخص الأزمنة العشرة (ابدئي من هنا)</button>`;
    RULES.forEach((r,i) => {
      if (i === RULES.length-1) return;
      h += `<button class="big sec" onclick="openRule(${i})">${i+1}. ${r.ar} <span class="muted">(${r.en})</span></button>`;
    });
    h += `<button onclick="go('home')">الرئيسية</button>`;
  }

  else if (view === 'rule') {
    const r = RULES[cur];
    const n = QS.filter(q=>q.r===cur).length;
    h = `<div class="muted">الدرس ${cur+1} من ${RULES.length}</div><h1>${r.ar}</h1><div class="muted en">${r.en}</div>${r.body}
      ${n ? `<button onclick="startRule(${cur})">تدرّبي على أسئلة هذه القاعدة (${n})</button>` : `<button onclick="startRule(0)">ابدئي بأسئلة المضارع</button>`}
      ${cur>0?`<button class="sec" onclick="openRule(${cur-1})">الدرس السابق</button>`:''}
      ${cur<RULES.length-1?`<button class="sec" onclick="openRule(${cur+1})">الدرس التالي</button>`:''}
      <button class="sec" onclick="go('lessons')">كل الدروس</button>`;
  }

  else if (view === 'quiz') {
    const q = QS[list[idx]];
    const answered = ans[idx] !== undefined;
    h = `<div class="muted">${RULES[q.r].ar} | السؤال ${idx+1} من ${list.length}</div>`;
    if (timed) h += `<div>الوقت المتبقي: <span id="timer">${fmt(left)}</span></div>`;
    if (q.p) h += `<div class="muted">اقرئي النص ثم أجيبي:</div><div class="passage">${esc(PASSAGES[q.p])}</div>`;
    h += `<h2 class="en">${esc(q.q)}</h2>`;
    q.o.forEach((opt,i) => {
      let cls = '';
      if (!timed && answered) { if (i === q.a) cls = ' ok'; else if (ans[idx] === i) cls = ' bad'; }
      else if (ans[idx] === i) cls = ' sel';
      h += `<button class="opt${cls}" onclick="pick(${i})">${esc(opt)}</button>`;
    });
    if (!timed && answered) {
      const ok = ans[idx] === q.a;
      h += `<div class="fb"><b>${ok ? 'إجابة صحيحة' : 'إجابة خاطئة. الصحيح: <span class="en">' + esc(q.o[q.a]) + '</span>'}</b><br>${esc(q.e)}</div>
        <button onclick="next()">${idx === list.length-1 ? 'عرض النتيجة' : 'التالي'}</button>
        <button class="sec" onclick="openRule(${q.r})">شرح القاعدة</button>`;
    }
    if (timed) {
      h += `<div style="margin-top:12px"><button onclick="prev()">السابق</button><button onclick="next()">${idx === list.length-1 ? 'إنهاء الاختبار' : 'التالي'}</button></div><div class="pal">`;
      list.forEach((_,i) => { h += `<button class="${i===idx?'cur':(ans[i]!==undefined?'done':'')}" onclick="jump(${i})">${i+1}</button>`; });
      h += `</div><button onclick="finish()">إنهاء الاختبار الآن</button>`;
    } else {
      h += `<br><button class="sec" onclick="go('home')">الرئيسية</button>`;
    }
  }

  else if (view === 'results') {
    let total = 0;
    const per = RULES.map(() => ({c:0,n:0}));
    const wrong = [];
    list.forEach((qi,i) => {
      const q = QS[qi]; per[q.r].n++;
      if (ans[i] === q.a) { total++; per[q.r].c++; } else wrong.push({i,q});
    });
    h = `<h1>النتيجة: ${total} من ${list.length} (${Math.round(total/list.length*100)}%)</h1><h3>حسب القاعدة</h3>`;
    RULES.forEach((r,i) => {
      if (per[i].n) h += `<div class="row"><span>${r.ar}</span><span>${per[i].c} / ${per[i].n}</span></div>`;
    });
    h += `<h3>الأسئلة الخاطئة والشرح</h3>`;
    if (!wrong.length) h += `<p>ممتاز! كل الإجابات صحيحة.</p>`;
    wrong.forEach(({i,q}) => {
      h += `<div class="wrong"><div class="en"><b>${i+1}. ${esc(q.q)}</b></div>
        إجابتك: <span class="en">${ans[i]===undefined?'لم تجيبي':esc(q.o[ans[i]])}</span><br>
        الصحيح: <span class="en">${esc(q.o[q.a])}</span><br>
        <span class="muted">${esc(q.e)}</span><br>
        <button class="sec" onclick="openRule(${q.r})">شرح القاعدة: ${RULES[q.r].ar}</button></div>`;
    });
    h += `<br><button onclick="go('home')">الرئيسية</button>`;
  }

  app.innerHTML = h;
  window.scrollTo(0,0);
}

render();
</script>
