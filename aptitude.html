<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب Aptitude</title>
<style>
  body{font-family:system-ui,Tahoma,sans-serif;background:#f4f6fb;margin:0;padding:16px;color:#222}
  .card{background:#fff;max-width:720px;margin:auto;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{font-size:22px;margin:0 0 12px}
  h2{font-size:20px;line-height:1.8;margin:12px 0}
  button{font-size:17px;padding:12px 16px;border:0;border-radius:10px;background:#3867d6;color:#fff;cursor:pointer;margin:4px}
  button.opt{display:block;width:100%;text-align:right;background:#eef2fb;color:#222;border:2px solid #d0d9ef;margin:6px 0}
  button.sel{border-color:#3867d6}
  button.ok{background:#20a35b;color:#fff;border-color:#20a35b}
  button.bad{background:#d64545;color:#fff;border-color:#d64545}
  input{font-size:18px;padding:10px;border-radius:8px;border:2px solid #ccd;width:220px}
  .pal{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}
  .pal button{width:38px;height:38px;padding:0;font-size:13px;margin:0;background:#dfe5f3;color:#222}
  .pal button.done{background:#8a9cc7;color:#fff}
  .pal button.cur{background:#f0a500;color:#fff}
  .muted{color:#666;font-size:14px}
  .fb{margin-top:12px;padding:12px;border-radius:8px;background:#fff7e0;line-height:1.7}
  .sec{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0}
  #timer{font-weight:bold;font-size:20px;color:#d64545}
.fig,.grid{direction:ltr;margin:10px 0}
  .fig{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(3,62px);gap:4px}
  .cell{background:#fff;border:1px solid #ccd;border-radius:6px}
  .qm{width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;border:2px dashed #3867d6;border-radius:6px;color:#3867d6}
  .opts{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
  button.opt.svgb{display:inline-block;width:auto;padding:6px;text-align:center}
  button.opt.svgb .cell{border:0}
  .wrong{border-bottom:1px solid #eee;padding:8px 0;line-height:1.7}
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const SECS = ['المتسلسلات الرقمية','الاستدلال العددي','المنطق اللفظي','النسب والسرعة والعمل','أسئلة إضافية','الأشكال والرسومات'];

// t: 'm' = اختيار من متعدد (a = رقم الخيار)، 'n' = رقم (a = العدد)، 'x' = نص (a = النص)
const M = (s,q,o,a,e) => ({s,t:'m',q,o,a,e});

const X = (s,q,a,e) => ({s,t:'x',q,a,e});

// ===== أدوات الرسم (SVG) =====
const K = '#2d3a5a';
const W = (inner, d=60) => `<svg viewBox="0 0 60 60" width="${d}" height="${d}" class="cell">${inner}</svg>`;
function polyPts(n,cx=30,cy=30,r=20){const p=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
const poly = (n,fill='none') => `<polygon points="${polyPts(n)}" fill="${fill}" stroke="${K}" stroke-width="2.5"/>`;
const circ = (fill='none') => `<circle cx="30" cy="30" r="18" fill="${fill}" stroke="${K}" stroke-width="2.5"/>`;
const sq = (fill='none') => `<rect x="13" y="13" width="34" height="34" fill="${fill}" stroke="${K}" stroke-width="2.5"/>`;
const tri = (fill='none') => `<polygon points="${polyPts(3,30,33,21)}" fill="${fill}" stroke="${K}" stroke-width="2.5"/>`;
function POS(k){const p=[];for(let i=0;i<k;i++){const row=Math.floor(i/3),inRow=Math.min(3,k-row*3),col=i%3;p.push([30+(col-(inRow-1)/2)*16,(k>3?20:30)+row*20]);}return p;}
const many = (type,k) => POS(k).map(([x,y]) => type==='c' ? `<circle cx="${x}" cy="${y}" r="5.5" fill="${K}"/>` : type==='s' ? `<rect x="${x-5.5}" y="${y-5.5}" width="11" height="11" fill="${K}"/>` : `<polygon points="${polyPts(3,x,y+1,7)}" fill="${K}"/>`).join('');
const arrow = a => `<g transform="rotate(${a} 30 30)"><line x1="30" y1="50" x2="30" y2="18" stroke="${K}" stroke-width="4"/><polygon points="30,8 21,21 39,21" fill="${K}"/></g>`;
const FRAME = `<rect x="10" y="10" width="40" height="40" fill="none" stroke="${K}" stroke-width="2.5"/>`;
const quad = k => {const [x,y]=[[10,10],[30,10],[30,30],[10,30]][k];return FRAME+`<rect x="${x}" y="${y}" width="20" height="20" fill="${K}"/><line x1="30" y1="10" x2="30" y2="50" stroke="${K}"/><line x1="10" y1="30" x2="50" y2="30" stroke="${K}"/>`;};
const corner = k => {const [x,y]=[[17,17],[43,17],[43,43],[17,43]][k];return FRAME+`<circle cx="${x}" cy="${y}" r="5" fill="${K}"/>`;};
const L = (a,m=false) => `<g transform="rotate(${a} 30 30)${m?' translate(60,0) scale(-1,1)':''}"><path d="M20 6 H29 V43 H46 V52 H20 Z" fill="${K}"/></g>`;
const R = t => `<g transform="${t}"><text x="30" y="46" font-size="44" text-anchor="middle" direction="ltr" font-family="Arial,sans-serif" font-weight="bold" fill="${K}">R</text></g>`;
const seq = cells => `<div class="muted">اقرئي الأشكال من اليسار لليمين</div><div class="fig">${cells.map(c=>W(c)).join('')}<div class="qm">?</div></div>`;
const grid = rows => `<div class="grid">${rows.flat().map(c=>c===null?'<div class="qm">?</div>':W(c)).join('')}</div>`;
const F = (q,img,o,a,e) => ({s:5,t:'m',q,img,o,a,e,svgO:true});
const FN = (q,img,a,e) => ({s:5,t:'n',q,img,a,e});

  // ===== المتسلسلات الرقمية (1-25) =====

  N(1,'يُنهي علي مهمة في 4 أيام، ويُنهيها عمر في 6 أيام. كم يوماً يحتاجان معاً؟',2.4,'1/4 + 1/6 = 5/12، والمقلوب 12/5'),

  M(2,'أيّ كلمة لا تنتمي للمجموعة؟',['التفاح','الموز','الجزر','البرتقال'],2,'البقية فواكه'),

let mode = null, idx = 0, ans = {}, left = 0, tid = null, done = false;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function parseNum(s){
  s = String(s).trim().replace('%','').replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace('٫','.').replace(',','.');
  if (s.includes('/')) { const [x,y] = s.split('/').map(Number); return x / y; }
  return Number(s);
}

function isCorrect(q, g){
  if (g === undefined || g === '') return false;
  if (q.t === 'm') return g === q.a;
  if (q.t === 'x') return String(g).trim().toUpperCase() === q.a.toUpperCase();
  const n = parseNum(g);
  return !isNaN(n) && Math.abs(n - q.a) < 0.001;
}

function optHtml(q,i){ return q.svgO ? W(q.o[i]) : esc(q.o[i]); }
function ansHtml(q){ return q.t === 'm' ? optHtml(q,q.a) : esc(String(q.a)); }
function yourHtml(q, g){ if (g === undefined) return 'لم تجيبي'; return q.t === 'm' ? optHtml(q,g) : esc(String(g)); }

function startMode(m){
  mode = m; idx = 0; ans = {}; done = false;
  clearInterval(tid);
  if (m === 'full') { left = 75*60; tid = setInterval(tick, 1000); }
  render();
}

function tick(){
  left--;
  if (left <= 0) { left = 0; updTimer(); finish(); return; }
  updTimer();
}

function updTimer(){
  const el = document.getElementById('timer');
  if (el) el.textContent = Math.floor(left/60) + ':' + String(left % 60).padStart(2,'0');
}

function finish(){ clearInterval(tid); done = true; render(); }

function pick(i){
  if (mode === 'practice' && ans[idx] !== undefined) return;
  ans[idx] = i; render();
}

function pickInput(){
  const v = document.getElementById('inp').value;
  if (v.trim() === '') return;
  if (mode === 'practice' && ans[idx] !== undefined) return;
  ans[idx] = v; render();
}

function go(i){ idx = i; render(); }

function next(){
  if (idx < Q.length - 1) { idx++; render(); }
  else finish();
}

function prev(){ if (idx > 0) { idx--; render(); } }

function restart(){ clearInterval(tid); mode = null; done = false; idx = 0; ans = {}; render(); }

function render(){
  const app = document.getElementById('app');
  if (mode === null) {
    app.innerHTML = `
      <h1>تدريب Aptitude: ${Q.length} سؤال</h1>
      <p class="muted">اختاري طريقة التدريب:</p>
      <button onclick="startMode('full')">اختبار كامل بالوقت (75 دقيقة)</button>
      <button onclick="startMode('practice')">تدريب سؤال بسؤال مع التصحيح الفوري</button>`;
    return;
  }
  if (done) { renderResults(); return; }

  const q = Q[idx];
  const answered = ans[idx] !== undefined;
  let h = `<div class="muted">${SECS[q.s]} | السؤال ${idx+1} من ${Q.length}</div>`;
  if (mode === 'full') h += `<div>الوقت المتبقي: <span id="timer"></span></div>`;
  h += `<h2>${esc(q.q)}</h2>${q.img || ''}`;

  if (q.t === 'm') {
    if (q.svgO) h += `<div class="opts">`;
    q.o.forEach((opt, i) => {
      let cls = '';
      if (mode === 'practice' && answered) {
        if (i === q.a) cls = ' ok';
        else if (ans[idx] === i) cls = ' bad';
      } else if (ans[idx] === i) cls = ' sel';
      h += `<button class="opt${cls}${q.svgO ? ' svgb' : ''}" onclick="pick(${i})">${optHtml(q,i)}</button>`;
    });
    if (q.svgO) h += `</div>`;
  } else {
    const locked = mode === 'practice' && answered;
    h += `<input id="inp" value="${esc(answered ? ans[idx] : '')}" placeholder="اكتبي الجواب" ${locked ? 'disabled' : ''}> `;
    if (!locked) h += `<button onclick="pickInput()">${mode === 'practice' ? 'تحقق' : 'حفظ الجواب'}</button>`;
  }

  if (mode === 'practice' && answered) {
    const ok = isCorrect(q, ans[idx]);
    h += `<div class="fb"><strong>${ok ? 'إجابة صحيحة' : 'إجابة خاطئة. الجواب الصحيح: ' + ansHtml(q)}</strong><br>${esc(q.e)}</div>`;
    h += `<button onclick="next()">${idx === Q.length-1 ? 'عرض النتيجة' : 'التالي'}</button>`;
  }

  if (mode === 'full') {
    h += `<div style="margin-top:14px"><button onclick="prev()">السابق</button><button onclick="next()">${idx === Q.length-1 ? 'إنهاء الاختبار' : 'التالي'}</button></div>`;
    h += `<div class="pal">`;
    Q.forEach((_, i) => {
      const c = i === idx ? 'cur' : (ans[i] !== undefined ? 'done' : '');
      h += `<button class="${c}" onclick="go(${i})">${i+1}</button>`;
    });
    h += `</div>`;
    h += `<button onclick="finish()">إنهاء الاختبار الآن</button>`;
  }

  app.innerHTML = h;
  if (mode === 'full') updTimer();
}

function renderResults(){
  const app = document.getElementById('app');
  let total = 0;
  const secTotal = SECS.map(() => ({c:0,n:0}));
  const wrong = [];
  Q.forEach((q, i) => {
    secTotal[q.s].n++;
    if (isCorrect(q, ans[i])) { total++; secTotal[q.s].c++; }
    else wrong.push({i, q});
  });
  const pct = Math.round(total / Q.length * 100);
  let h = `<h1>النتيجة: ${total} من ${Q.length} (${pct}%)</h1>`;
  SECS.forEach((name, s) => {
    h += `<div class="sec"><span>${name}</span><span>${secTotal[s].c} / ${secTotal[s].n}</span></div>`;
  });
  h += `<h2 style="font-size:18px">الأسئلة الخاطئة والشرح</h2>`;
  if (wrong.length === 0) h += `<p>ممتاز! كل الإجابات صحيحة.</p>`;
  wrong.forEach(({i, q}) => {
    h += `<div class="wrong"><strong>${i+1}. ${esc(q.q)}</strong>${q.img || ''}<br>
      إجابتك: ${yourHtml(q, ans[i])}<br>
      الجواب الصحيح: ${ansHtml(q)}<br>
      <span class="muted">${esc(q.e)}</span></div>`;
  });
  h += `<br><button onclick="restart()">إعادة من البداية</button>`;
  app.innerHTML = h;
}

render();
</script>
